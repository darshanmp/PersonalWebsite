<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Darshan Masti Prakash</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="{{ '/css/main.css' | prepend: site.baseurl }}" rel="stylesheet">

  <style>
    /* Blog-specific layout overrides */
    .blog-wrapper {
      padding-top: 96px;
      padding-bottom: 80px;
      min-height: 80vh;
    }
  </style>
</head>

<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="{{ site.baseurl }}/" class="nav-logo">Darshan<span class="accent">.</span></a>
      <ul class="nav-links">
        <li><a href="{{ site.baseurl }}/#about">About</a></li>
        <li><a href="{{ site.baseurl }}/#articles">Writing</a></li>
        <li><a href="{{ site.baseurl }}/#videos">Videos</a></li>
        <li><a href="{{ '/blog' | prepend: site.baseurl }}" class="nav-cta">Blog</a></li>
      </ul>
    </div>
  </nav>

  <!-- Content -->
  <div class="blog-wrapper">
    <div class="container">
      {{ content }}
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <span class="nav-logo">Darshan<span class="accent">.</span></span>
      <div class="footer-links">
        <a href="{{ site.baseurl }}/#about">About</a>
        <a href="{{ site.baseurl }}/#articles">Writing</a>
        <a href="{{ '/blog' | prepend: site.baseurl }}">Blog</a>
      </div>
      <p class="footer-copy">&copy; 2026 Darshan Masti Prakash</p>
    </div>
  </footer>

</body>
</html>
